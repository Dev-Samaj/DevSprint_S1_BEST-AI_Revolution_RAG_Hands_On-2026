name: Register Contributor

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  register:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          USERNAME=$(gh pr view $PR_NUMBER --repo $REPO --json author --jq '.author.login')
          MERGED_AT=$(gh pr view $PR_NUMBER --repo $REPO --json mergedAt --jq '.mergedAt')

          FOLDER="submissions/$USERNAME"

          if [ ! -d "$FOLDER" ]; then
            echo "ERROR: $FOLDER does not exist"
            exit 1
          fi

          DATE=$(date -d "$MERGED_AT" "+%d %b %Y, %H:%M UTC")

          python3 - <<PY
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          row = "| | $USERNAME | [@$USERNAME](https://github.com/$USERNAME) | [$USERNAME](./submissions/$USERNAME) | $DATE |"

          marker = "|---|---|---|---|---|"

          if row not in text:
              text = text.replace(marker, marker + "\n" + row, 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: register contributor $USERNAME" || exit 0
          git push
